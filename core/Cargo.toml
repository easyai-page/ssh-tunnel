[package]
name = "ssh-tunnel-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
russh = "0.63"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
