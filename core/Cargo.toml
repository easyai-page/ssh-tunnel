[package]
name = "ssh-tunnel-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
russh = "0.63"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# keyring 3 没有任何默认 feature:不勾选平台后端时静默退化为内存 mock store,
# 凭据只活在当次进程里,应用重启后全部丢失(报「未保存密码」)。
# 必须显式启用各平台真实后端:Windows 凭据管理器 / macOS 钥匙串 / Linux keyutils+secret-service
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
