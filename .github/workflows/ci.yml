name: CI

on:
  push:
    branches: [master]
    # v* tag 触发发版:tauri-action 会自动创建 Release 并挂上各平台安装包
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# tauri-action 创建 Release 需要写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 快速失败的测试阶段:不过就不浪费构建机的钱
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Frontend tests
        run: pnpm test
      - name: Frontend type check
        run: pnpm type-check
      - name: Rust core tests
        run: cargo test -p ssh-tunnel-core

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-14, target: aarch64-apple-darwin }
          - { platform: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { platform: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 壳依赖 webkitgtk,只有 Linux 需要
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tauri-action 不会自己认 GITHUB_REF 的 tag,必须显式传;非 tag 构建传空串即只编译不发版
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ssh-tunnel v__VERSION__
          releaseBody: See the assets to download this version and install.
          args: --target ${{ matrix.target }}

      # 本仓库是 cargo workspace,target 目录在工作区根而非 src-tauri 下
      # 原生编译时产物在 target/release/bundle,显式 target 时在 target/<target>/release/bundle,两个都收
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-${{ matrix.target }}
          path: |
            target/release/bundle/**
            target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
